apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cd-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ci-cd-pipeline
  template:
    metadata:
      labels:
        app: ci-cd-pipeline
    spec:
      containers:
      - name: ci-cd-pipeline
        image: <DOCKER-HUB-USERNAME>/ci-cd-pipeline:1
        ports:
        - containerPort: 3000
